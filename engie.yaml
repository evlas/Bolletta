#    name: Arera DispBT
#    unit_of_measurement: "€/anno"
#    value_template: "{{ value_json.dispbt }}"
    
  - platform: rest
    resource: http://192.168.70.50/arera/arera.json
    name: Arera Quota Fissa
    unit_of_measurement: "€/anno"
    value_template: "{{ value_json.s1 }}"
    unique_id: quotafissas1
    
  - platform: rest
    resource: http://192.168.70.50/arera/arera.json
    name: Arera Quota Potenza
    unit_of_measurement: "€/kW/anno"
    value_template: "{{ value_json.s2 }}"
    unique_id: quotafissas2
    
  - platform: rest
    resource: http://192.168.70.50/arera/arera.json
    name: Arera Quota Energia
    unit_of_measurement: "€/kWh"
    value_template: "{{ value_json.s3 }}"
    unique_id: quotafissas3
    
  - platform: rest
    resource: http://192.168.70.50/arera/arera.json
