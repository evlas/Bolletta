sensor:
  - platform: rest
    resource: http://192.168.70.50/arera/arera.json
    name: Arera Ultimo Aggiornamento
    value_template: "{{ value_json.today }}"
    
  - platform: rest
    resource: http://192.168.70.50/arera/arera.json
    name: Arera CDISPD
    unit_of_measurement: "€/kWh"
    value_template: "{{ value_json.cdispd }}"
    unique_id: cdispd

  - platform: rest
    resource: http://192.168.70.50/arera/arera.json
    name: Arera CSED
    unit_of_measurement: "€/kWh"
    value_template: "{{ value_json.csed }}"
    unique_id: csed

  - platform: rest
    resource: http://192.168.70.50/arera/arera.json
    name: Arera CPSTGD
    unit_of_measurement: "€/kWh"
    value_template: "{{ value_json.cpstgd }}"
    unique_id: cpstgd

  - platform: rest
    resource: http://192.168.70.50/arera/arera.json
    name: Arera Parametro lamda
    unit_of_measurement: "€/anno"
    value_template: "{{ value_json.parametrolamda }}"
    unique_id: parametro_lamda
    
#  - platform: rest
