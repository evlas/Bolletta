    unit_of_measurement: "€/kWh"
    value_template: "{{ value_json.uc6qe }}"
    unique_id: quotafissauc6qe
    
  - platform: rest
    resource: http://192.168.70.50/arera/arera.json
    name: Arera UC6 QP
    unit_of_measurement: "€/kW/anno"
    value_template: "{{ value_json.uc6qp }}"
    unique_id: quotafissauc6qp
    
  - platform: rest
    resource: http://192.168.70.50/arera/arera.json
    name: Arera Asos
    unit_of_measurement: "€/kWh"
    value_template: "{{ value_json.asos }}"
    unique_id: quotafissaasos
    
  - platform: rest
    resource: http://192.168.70.50/arera/arera.json
    name: Arera Arim
    unit_of_measurement: "€/kWh"
    value_template: "{{ value_json.arim }}"
    unique_id: quotafissaarim
    
template:
  - sensor:
      - name: "Engie Prezzo Unitario F0"
        unit_of_measurement: "€/kWh"
        state_class: measurement
        state: >
          {% set cef = states('sensor.pun_mono_orario') | float(0) %}
          {% set pdr = states('sensor.pun_mono_orario') | float(0) * 0.1 %}
          {% set ccl = states('input_number.engie_ccl') | float(0) %}
      
          {% set pd = states('input_number.engie_pd') | float(0) %}
          {% set pdf = states('input_number.engie_pd_forfettario') | float(0) %}

          {% set s3  = states('sensor.arera_quota_energia') | float(0) %}

          {% set uc3 = states('sensor.arera_uc3') | float(0) %}
          {% set uc6  = states('sensor.arera_uc6_qe') | float(0) %}

          {% set asos = states('sensor.arera_asos') | float(0) %}
          {% set arim  = states('sensor.arera_arim') | float(0) %}

          {% set accisa = states('input_number.engie_accisa') | float(0) %}
          {% set iva  = states('input_number.engie_iva') | float(0) %}

          {{ ((cef + ccl + pd + pdr + pdf + s3 + uc3 + uc6 + asos + arim + accisa)*(1 + iva/100.0)) | round(8, default=0) }}
  
      - name: "Engie Prezzo Unitario F1"
        unit_of_measurement: "€/kWh"
        state_class: measurement
        state: >
          {% set cef = states('sensor.pun_fascia_f1') | float(0) %}
          {% set pdr = states('sensor.pun_fascia_f1') | float(0) * 0.1 %}
          {% set ccl = states('input_number.engie_ccl') | float(0) %}

          {% set pd = states('input_number.engie_pd') | float(0) %}
          {% set pdf = states('input_number.engie_pd_forfettario') | float(0) %}

          {% set s3  = states('sensor.arera_quota_energia') | float(0) %}

          {% set uc3 = states('sensor.arera_uc3') | float(0) %}
          {% set uc6  = states('sensor.arera_uc6_qe') | float(0) %}

          {% set asos = states('sensor.arera_asos') | float(0) %}
          {% set arim  = states('sensor.arera_arim') | float(0) %}

          {% set accisa = states('input_number.engie_accisa') | float(0) %}
          {% set iva  = states('input_number.engie_iva') | float(0) %}

          {{ ((cef + ccl + pd + pdr + pdf + s3 + uc3 + uc6 + asos + arim + accisa)*(1 + iva/100.0)) | round(8, default=0) }}

      - name: "Engie Prezzo Unitario F2"
        unit_of_measurement: "€/kWh"
        state_class: measurement
        state: >
          {% set cef = states('sensor.pun_fascia_f2') | float(0) %}
          {% set pdr = states('sensor.pun_fascia_f2') | float(0) * 0.1 %}
          {% set ccl = states('input_number.engie_ccl') | float(0) %}

          {% set pd = states('input_number.engie_pd') | float(0) %}
          {% set pdf = states('input_number.engie_pd_forfettario') | float(0) %}

          {% set s3  = states('sensor.arera_quota_energia') | float(0) %}

          {% set uc3 = states('sensor.arera_uc3') | float(0) %}
          {% set uc6  = states('sensor.arera_uc6_qe') | float(0) %}

          {% set asos = states('sensor.arera_asos') | float(0) %}
          {% set arim  = states('sensor.arera_arim') | float(0) %}

          {% set accisa = states('input_number.engie_accisa') | float(0) %}
          {% set iva  = states('input_number.engie_iva') | float(0) %}

          {{ ((cef + ccl + pd + pdr + pdf + s3 + uc3 + uc6 + asos + arim + accisa)*(1 + iva/100.0)) | round(8, default=0) }}

      - name: "Engie Prezzo Unitario F3"
        unit_of_measurement: "€/kWh"
        state_class: measurement
        state: >
          {% set cef = states('sensor.pun_fascia_f3') | float(0) %}
          {% set pdr = states('sensor.pun_fascia_f3') | float(0) * 0.1 %}
          {% set ccl = states('input_number.engie_ccl') | float(0) %}

          {% set pd = states('input_number.engie_pd') | float(0) %}
          {% set pdf = states('input_number.engie_pd_forfettario') | float(0) %}

          {% set s3  = states('sensor.arera_quota_energia') | float(0) %}

          {% set uc3 = states('sensor.arera_uc3') | float(0) %}
          {% set uc6  = states('sensor.arera_uc6_qe') | float(0) %}

          {% set asos = states('sensor.arera_asos') | float(0) %}
          {% set arim  = states('sensor.arera_arim') | float(0) %}

          {% set accisa = states('input_number.engie_accisa') | float(0) %}
          {% set iva  = states('input_number.engie_iva') | float(0) %}

          {{ ((cef + ccl + pd + pdr + pdf + s3 + uc3 + uc6 + asos + arim + accisa)*(1 + iva/100.0)) | round(8, default=0) }}

      - name: "Engie Prezzo Fisso Giornaliero"
        unit_of_measurement: "€/giorno"
        state_class: measurement
        state: >
          {% set pcv = states('input_number.engie_pcv') | float(0) %}
          {% set dispbt  = states('input_number.engie_dispbt') | float(0) %}
          
          {% set qf = states('sensor.arera_quota_fissa') | float(0) %}
          {% set qp = states('sensor.arera_quota_potenza') | float(0) %}

          {% set uc6 = states('sensor.arera_uc6_qp') | float(0) %}
 
          {% if is_state("input_select.selettore_kw_contatore", "3 kW") %}
                {% set pi = 3.0 %}
          {%-elif is_state("input_select.selettore_kw_contatore", "4,5 kW") %}
                {% set pi = 4.5 %}
          {%-elif is_state("input_select.selettore_kw_contatore", "6 kW") %}
                {% set pi = 6.0 %}
          {%-elif is_state("input_select.selettore_kw_contatore", "10 kW") %}
                {% set pi = 10.0 %}
          {% endif %}
 
          {% set iva  = states('input_number.engie_iva') | float(0) %}

          {{ ((pcv + dispbt + qf + qp*pi + uc6*pi)*(1 + iva/100.0)/365.0) | round(8, default=0) }}








